<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html

    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
    # GitHub Codespaces' web forwarding terminates TLS but does not set
    # X-Forwarded-Proto, and forwards the Host with its port (…:8080), so
    # match the port too. Makes PHP see https so canonical URLs and the
    # request URL never disagree (which would 302 loop). Local http-only
    # stacks keep plain http.
    SetEnvIf Host "^[^:]+\.app\.github\.dev(:[0-9]+)?$" HTTPS=on

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>

    <DirectoryMatch "^/var/www/html/(config|cache|log|logs|var|override|install)(/|$)">
        Require all denied
    </DirectoryMatch>

    <FilesMatch "(^\.|settings\.inc\.php$|composer\.(json|lock)$)">
        Require all denied
    </FilesMatch>

    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
    </IfModule>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
