# QloApps / PrestaShop 1.6 nginx server
server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.php;

    # Never serve sensitive internal dirs (must precede the PHP handler)
    location ~ ^/(config|install|cache|logs|var|override)/ {
        deny all;
    }

    # Never serve dotfiles / .ht*
    location ~ /\. {
        deny all;
    }

    # Static assets (front + admin) - long cache
    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|css|js|woff2?|ttf|eot)$ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Front controller + friendly URLs (works whether or not
    # PS_REWRITING_SETTINGS is enabled in the admin)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTP_PROXY "";
    }
}
