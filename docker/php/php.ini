; QloApps / PrestaShop 1.6 PHP settings (production-friendly)
memory_limit = 256M
max_execution_time = 120
max_input_time = 120
max_input_vars = 5000

; File uploads (admin image/media uploads)
file_uploads = On
upload_max_filesize = 20M
post_max_size = 24M

; Error handling - PrestaShop 1.6 codebase, suppress modern-PHP deprecations
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT & ~E_NOTICE
expose_php = Off

; Locale
date.timezone = Asia/Kolkata

; Sessions
session.cookie_httponly = 1
session.use_strict_mode = 1

; OPcache - revalidate during development; production can set this to 0
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
